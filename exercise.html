                        green: '#9ca3af',
                        purple: '#fbbf24',
                        yellow: '#fbbf24',
                        red: '#f87171',
                    }
                }
            }
        }

    <style>
/* ═══════════════════════════════════════════════════════════════
   Sōl Haus — Warm Minimalist Design System
   ═══════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg-deep: #130F0B;
  --bg-dark: #1C1814;
  --bg-card: #1F1B17;
  --bg-hover: #2A2520;
  --cream: #F5F0EB;
  --cream-warm: #E8E0D8;
  --taupe: #C4B5A5;
  --warm-grey: #8A7E72;
  --muted-brown: #6B5E52;
  --accent-gold: #B8A88A;
  --accent-glow: rgba(184, 168, 138, 0.15);
  --border: rgba(196, 181, 165, 0.12);
  --border-light: rgba(196, 181, 165, 0.20);
  --text: #F5F0EB;
  --text-secondary: #A89B8C;
  --text-muted: #6B5E52;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-heading: 'Playfair Display', Georgia, serif;
  --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.25);
  --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.20);
  --radius: 20px;
  --radius-sm: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(184,168,138,0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(196,181,165,0.02) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

/* ── Navbar ── */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(19, 15, 11, 0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
}
.navbar-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 72px; gap: 20px;
}
.navbar-brand {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-heading);
  font-weight: 700; font-size: 1.4rem;
  color: var(--cream); text-decoration: none;
}
.navbar-brand .logo {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-gold), var(--muted-brown));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 4px 16px var(--accent-glow);
}
.nav-links { display: flex; gap: 8px; }
.nav-link {
  font-family: var(--font-body);
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 8px 16px; border-radius: 999px;
  color: var(--text-secondary); text-decoration: none;
  transition: all 0.25s ease; border: 1px solid transparent;
}
.nav-link:hover {
  background: rgba(196, 181, 165, 0.08);
  color: var(--cream); border-color: var(--border);
}
.nav-link.active {
  background: rgba(184, 168, 138, 0.10);
  border-color: rgba(184, 168, 138, 0.25);
  color: var(--accent-gold);
}

/* ── Hero ── */
.hero {
  text-align: center; padding: 80px 24px 48px;
  position: relative; z-index: 1;
}
.hero h1 {
  font-family: var(--font-heading);
  font-size: 3.2rem; font-weight: 700;
  color: var(--cream);
  margin-bottom: 16px; letter-spacing: -0.02em;
  line-height: 1.15;
}
.hero h1 span {
  color: var(--accent-gold);
  font-style: italic;
}
.hero p {
  color: var(--text-secondary); font-size: 1.1rem;
  max-width: 520px; margin: 0 auto;
  font-weight: 300;
}

/* ── Layout ── */
.container {
  max-width: 1280px; margin: 0 auto;
  padding: 0 32px 80px;
  position: relative; z-index: 1;
}

/* ── Cards ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px; margin-top: 40px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px;
  transition: all 0.35s ease;
  text-decoration: none; color: var(--text);
  display: block; position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-gold), var(--taupe));
  opacity: 0; transition: opacity 0.3s ease;
}
.card:hover {
  border-color: var(--border-light);
  transform: translateY(-4px);
  box-shadow: var(--shadow-card);
}
.card:hover::before { opacity: 1; }
.card-icon {
  width: 52px; height: 52px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; margin-bottom: 20px;
  background: var(--bg-hover); border: 1px solid var(--border);
}
.card-title {
  font-family: var(--font-heading);
  font-size: 1.35rem; font-weight: 600;
  margin-bottom: 10px; color: var(--cream);
}
.card-desc {
  font-size: 0.92rem; color: var(--text-secondary);
  line-height: 1.65; font-weight: 300;
}
.card-arrow {
  position: absolute; bottom: 28px; right: 28px;
  color: var(--text-muted); font-size: 1.2rem;
  transition: all 0.25s ease;
}
.card:hover .card-arrow {
  color: var(--accent-gold); transform: translateX(4px);
}

/* ── Section headers ── */
.section-header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 32px;
}
.section-header .icon {
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center; font-size: 1.2rem;
  background: var(--bg-hover); border: 1px solid var(--border);
}
.section-header h2 {
  font-family: var(--font-heading);
  font-size: 1.6rem; font-weight: 600; color: var(--cream);
}
.section-header p {
  color: var(--text-secondary); font-size: 0.9rem; margin-top: 2px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: 0.88rem;
  font-weight: 600; cursor: pointer; border: 1px solid transparent;
  transition: all 0.25s ease; text-decoration: none;
}
.btn-primary {
  background: var(--accent-gold); color: var(--bg-deep);
  border-color: var(--accent-gold);
}
.btn-primary:hover {
  background: #c4b896; transform: translateY(-1px);
}
.btn-outline {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border);
}
.btn-outline:hover {
  color: var(--cream); border-color: var(--border-light);
  background: rgba(196, 181, 165, 0.06);
}

/* ── Tables ── */
table {
  width: 100%; border-collapse: collapse;
  font-size: 0.9rem; margin: 16px 0;
}
th, td {
  padding: 12px 16px; text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: var(--bg-hover);
  font-weight: 600; color: var(--accent-gold);
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
}
tr:hover td { background: rgba(196, 181, 165, 0.03); }

/* ── Formulas ── */
.formula {
  background: rgba(196, 181, 165, 0.05);
  border-left: 3px solid var(--accent-gold);
  padding: 16px 20px; margin: 14px 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.05rem; overflow-x: auto;
}
.formula-label {
  font-family: var(--font-body); font-size: 0.75rem;
  color: var(--text-muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
}

/* ── Inputs ── */
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  padding: 10px 14px; background: var(--bg-dark);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: var(--font-body); font-size: 0.9rem;
  outline: none; transition: all 0.2s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

/* ── Tabs ── */
.tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
.tab {
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-size: 0.85rem; font-weight: 500; cursor: pointer;
  border: 1px solid transparent; color: var(--text-secondary);
  transition: all 0.25s ease; background: transparent;
}
.tab:hover { color: var(--cream); background: var(--bg-hover); }
.tab.active {
  color: var(--accent-gold); background: rgba(184, 168, 138, 0.08);
  border-color: var(--border);
}

/* ── Footer ── */
.footer {
  text-align: center; padding: 40px 24px;
  color: var(--text-muted); font-size: 0.85rem;
  border-top: 1px solid var(--border); margin-top: 60px;
  position: relative; z-index: 1;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--muted-brown); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--warm-grey); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .hero h1 { font-size: 2.2rem; }
  .hero { padding: 60px 20px 32px; }
  .navbar-inner { padding: 0; height: 64px; }
  .card-grid { grid-template-columns: 1fr; }
  .container { padding: 0 20px 60px; }
}
</style>
</head>

        const subjects = [

        const questionsData = {
            'ACW1120': [
                {

                {

                    type: 'calculation',

                    working: 'Straight-line depreciation = (Cost - Residual Value) / Useful Life\n= ($50,000 - $5,000) / 5\n= $45,000 / 5\n= $9,000 per year',
                    explanation: 'The straight-line method allocates the depreciable amount evenly over the useful life. The depreciable amount is cost minus residual value.'

                {

                    type: 'theory',

                    topic: 'Accounting Principles',
                    question: 'Explain the accrual basis of accounting and how it differs from cash basis accounting. Provide examples.',

                {

                    type: 'mcq',
                    difficulty: 'easy',
                    topic: 'Double Entry',
                    question: 'When a company pays off an accounts payable, which accounts are affected?',
                    options: ['Debit Cash, Credit Accounts Payable', 'Debit Accounts Payable, Credit Cash', 'Debit Expense, Credit Cash', 'Debit Accounts Receivable, Credit Cash'],

        // ===================== STATE =====================
        let currentSubject = 'ACW1120';
        let currentFilter = { difficulty: 'all', topic: 'all', bookmarked: false, review: false };
        let userState = {
            completed: new Set(),
            bookmarks: new Set(),
            review: new Set(),
            scores: {},
            timerStart: null,
            timerElapsed: 0,
            timerRunning: false

        // ===================== TIMER =====================
        let timerInterval;

        function startTimer() {
            if (!userState.timerRunning) {
                userState.timerStart = Date.now() - userState.timerElapsed;
                userState.timerRunning = true;
                document.getElementById('timer').classList.remove('hidden');
                document.getElementById('start-timer-btn').classList.add('hidden');
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        function pauseTimer() {
            if (userState.timerRunning) {
                userState.timerRunning = false;
                clearInterval(timerInterval);
                document.getElementById('timer-btn').textContent = 'Resume';
                document.getElementById('timer-btn').onclick = resumeTimer;
            }
        }

        function resumeTimer() {
            if (!userState.timerRunning) {
                userState.timerStart = Date.now() - userState.timerElapsed;
                userState.timerRunning = true;
                timerInterval = setInterval(updateTimer, 1000);
                document.getElementById('timer-btn').textContent = 'Pause';
                document.getElementById('timer-btn').onclick = pauseTimer;
            }
        }

        function toggleTimer() {
            if (userState.timerRunning) {
                pauseTimer();
            } else {
                resumeTimer();
            }
        }

        function updateTimer() {
            userState.timerElapsed = Date.now() - userState.timerStart;
            const totalSeconds = Math.floor(userState.timerElapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            document.getElementById('timer-display').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // ===================== RENDERING =====================
        function renderSubjectTabs() {
            const container = document.getElementById('subject-tabs');
            container.innerHTML = subjects.map(sub => `
                <button onclick="selectSubject('${sub.code}')" 
                    class="subject-tab px-4 py-2 rounded-lg text-sm font-medium transition ${currentSubject === sub.code ? 'bg-accent text-dark' : 'bg-surface text-text/70 hover:bg-surface/80'}"
                    data-subject="${sub.code}">
                    ${sub.code}
                </button>
            `).join('');
        }

        function renderTopicFilters() {
            const questions = questionsData[currentSubject] || [];
            const topics = [...new Set(questions.map(q => q.topic))];
            const container = document.getElementById('topic-filters');
            container.innerHTML = topics.map(topic => `
                <button onclick="filterByTopic('${topic}')" 
                    class="filter-topic px-3 py-1 rounded-full text-xs bg-surface border border-accent/20 text-text/70 transition ${currentFilter.topic === topic ? 'bg-accent/20 text-accent border-accent' : ''}"
                    data-topic="${topic}">
                    ${topic}
                </button>
            `).join('') + `
                <button onclick="filterByTopic('all')" 
                    class="filter-topic px-3 py-1 rounded-full text-xs bg-surface border border-accent/20 text-text/70 transition ${currentFilter.topic === 'all' ? 'bg-accent/20 text-accent border-accent' : ''}"
                    data-topic="all">
                    All Topics
                </button>
            `;
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            let questions = questionsData[currentSubject] || [];

            // Apply filters
            if (currentFilter.difficulty !== 'all') {
                questions = questions.filter(q => q.difficulty === currentFilter.difficulty);
            }
            if (currentFilter.topic !== 'all') {
                questions = questions.filter(q => q.topic === currentFilter.topic);
            }
            if (currentFilter.bookmarked) {
                questions = questions.filter(q => userState.bookmarks.has(q.id));
            }
            if (currentFilter.review) {
                questions = questions.filter(q => userState.review.has(q.id));
            }

            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="glass rounded-xl p-12 text-center">
                        <i class="fas fa-search text-4xl text-text/20 mb-4"></i>
                        <p class="text-text/60">No questions match the current filters.</p>
                        <button onclick="resetFilters()" class="mt-4 px-4 py-2 rounded-lg bg-accent/20 text-accent hover:bg-accent/30 transition">
                            Reset Filters
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = questions.map(q => {
                const isCompleted = userState.completed.has(q.id);
                const isBookmarked = userState.bookmarks.has(q.id);
                const isReview = userState.review.has(q.id);
                const difficultyColor = q.difficulty === 'easy' ? 'green' : q.difficulty === 'medium' ? 'yellow' : 'red';
                const typeIcon = {
                    'mcq': 'fa-list-ul',
                    'calculation': 'fa-calculator',
                    'theory': 'fa-file-alt',
                    'case': 'fa-briefcase',
                    'truefalse': 'fa-check-circle'
                }[q.type];

                let answerHTML = '';
                if (q.type === 'mcq') {
                    answerHTML = `
                        <div class="space-y-2 mt-4">
                            ${q.options.map((opt, i) => `
                                <div class="mcq-option p-3 rounded-lg border border-text/10" 
                                     onclick="selectMCQ('${q.id}', ${i}, ${q.correct})"
                                     data-option="${i}" id="${q.id}-opt-${i}">
                                    <span class="font-medium mr-2">${String.fromCharCode(65 + i)}.</span>${opt}
                                </div>
                            `).join('')}

                        <div id="${q.id}-mcq-feedback" class="mt-3 hidden"></div>
                    `;
                } else if (q.type === 'truefalse') {
                    answerHTML = `
                        <div class="flex gap-3 mt-4">
                            <button onclick="answerTrueFalse('${q.id}', true, ${q.answer})" 
                                class="flex-1 py-2 rounded-lg border border-text/10 hover:bg-accent/10 transition">True</button>
                            <button onclick="answerTrueFalse('${q.id}', false, ${q.answer})" 
                                class="flex-1 py-2 rounded-lg border border-text/10 hover:bg-accent/10 transition">False</button>
                        </div>
                        <div id="${q.id}-tf-feedback" class="mt-3 hidden"></div>
                    `;
                }

                const workingHTML = q.working ? `
                    <div class="mt-4 pt-4 border-t border-text/10">
                        <h5 class="font-semibold text-accent mb-2">Working:</h5>
                        <pre class="whitespace-pre-wrap text-sm text-text/80 font-mono bg-[#0a0a0f]/50 p-3 rounded-lg">${q.working}</pre>
                    </div>
                ` : '';

                return `
                    <div class="question-card glass rounded-xl p-6 difficulty-${q.difficulty}" id="${q.id}">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <span class="px-2 py-1 rounded text-xs font-medium bg-${difficultyColor}/20 text-${difficultyColor} uppercase">${q.difficulty}</span>
                                <span class="flex items-center gap-1 text-sm text-text/60">
                                    <i class="fas ${typeIcon}"></i>
                                    ${q.type.toUpperCase()}
                                </span>
                                <span class="px-2 py-1 rounded text-xs bg-accent/10 text-accent">${q.topic}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleBookmark('${q.id}')" 
                                    class="bookmark-btn p-2 rounded-lg hover:bg-yellow/10 ${isBookmarked ? 'bookmarked' : 'text-text/40'}">
                                    <i class="fas fa-bookmark"></i>
                                </button>
                                <button onclick="toggleReview('${q.id}')" 
                                    class="review-btn p-2 rounded-lg hover:bg-purple/10 ${isReview ? 'marked' : 'text-text/40'}">
                                    <i class="fas fa-flag"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <span class="text-sm text-text/40 font-mono">${q.id}</span>
                            <h3 class="text-lg font-semibold text-text mt-1">${q.question.replace(/\n/g, '<br>')}</h3>

                                <i class="fas fa-eye" id="${q.id}-eye"></i>
                                <span id="${q.id}-btn-text">Show Answer</span>
                            </button>
                        </div>

                        <div id="${q.id}-answer" class="answer-hidden bg-surface/50 rounded-lg mt-4">
                            <div class="text-text">
                                <h4 class="font-semibold text-green mb-2">Answer:</h4>
                                <div class="text-text/90">${q.answer === true ? 'True' : q.answer === false ? 'False' : q.answer.toString().replace(/\n/g, '<br>')}</div>
                                ${workingHTML}
                                <div class="mt-4 pt-4 border-t border-text/10">
                                    <h5 class="font-semibold text-accent mb-2">Explanation:</h5>
                                    <p class="text-text/80">${q.explanation}</p>
                                </div>
                            </div>
                        </div>

                        ${isCompleted ? '<div class="mt-4 flex items-center gap-2 text-green text-sm"><i class="fas fa-check-circle"></i> Completed</div>' : ''}
                    </div>
                `;
            }).join('');
        }

        // ===================== INTERACTIONS =====================
        function selectSubject(code) {
            currentSubject = code;
            currentFilter.topic = 'all';
            renderSubjectTabs();
            renderTopicFilters();
            renderQuestions();
            updateStats();
            renderProgressBars();
        }

        function filterByDifficulty(diff) {
            currentFilter.difficulty = diff;
            document.querySelectorAll('.filter-diff').forEach(btn => {
                if (btn.dataset.diff === diff) {
                    btn.classList.add('bg-accent', 'text-dark', 'font-medium');
                    btn.classList.remove('bg-surface', 'text-green', 'text-yellow', 'text-red');
                } else {
                    btn.classList.remove('bg-accent', 'text-dark', 'font-medium');
                    btn.classList.add('bg-surface');
                    if (btn.dataset.diff === 'easy') btn.classList.add('text-green');
                    else if (btn.dataset.diff === 'medium') btn.classList.add('text-yellow');
                    else if (btn.dataset.diff === 'hard') btn.classList.add('text-red');
                }
            });
            renderQuestions();
        }

        function filterByTopic(topic) {
            currentFilter.topic = topic;
            renderTopicFilters();
            renderQuestions();
        }

        function filterBookmarked() {
            currentFilter.bookmarked = !currentFilter.bookmarked;
            currentFilter.review = false;
            document.getElementById('filter-bookmark-btn').classList.toggle('bg-yellow/20');
            document.getElementById('filter-review-btn').classList.remove('bg-purple/20');
            renderQuestions();
        }

        function filterReview() {
            currentFilter.review = !currentFilter.review;
            currentFilter.bookmarked = false;
            document.getElementById('filter-review-btn').classList.toggle('bg-purple/20');
            document.getElementById('filter-bookmark-btn').classList.remove('bg-yellow/20');
            renderQuestions();
        }

        function resetFilters() {
            currentFilter = { difficulty: 'all', topic: 'all', bookmarked: false, review: false };
            filterByDifficulty('all');
            renderTopicFilters();
            document.getElementById('filter-bookmark-btn').classList.remove('bg-yellow/20');
            document.getElementById('filter-review-btn').classList.remove('bg-purple/20');
        }

        function toggleAnswer(id) {
            const answerDiv = document.getElementById(`${id}-answer`);
            const btnText = document.getElementById(`${id}-btn-text`);
            const eye = document.getElementById(`${id}-eye`);
            
            if (answerDiv.classList.contains('answer-hidden')) {
                answerDiv.classList.remove('answer-hidden');
                answerDiv.classList.add('answer-visible');
                btnText.textContent = 'Hide Answer';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
                userState.completed.add(id);
                updateStats();
                renderProgressBars();
            } else {
                answerDiv.classList.remove('answer-visible');
                answerDiv.classList.add('answer-hidden');
                btnText.textContent = 'Show Answer';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }

        function selectMCQ(id, selected, correct) {
            const options = document.querySelectorAll(`[id^="${id}-opt-"]`);
            options.forEach((opt, i) => {
                opt.classList.remove('mcq-selected');
                opt.onclick = null;
                if (i === correct) {
                    opt.classList.add('mcq-correct');
                } else if (i === selected && i !== correct) {
                    opt.classList.add('mcq-wrong');
                }
            });

            const feedback = document.getElementById(`${id}-mcq-feedback`);
            feedback.classList.remove('hidden');
            if (selected === correct) {
                feedback.innerHTML = '<span class="text-green font-medium"><i class="fas fa-check-circle mr-1"></i> Correct!</span>';
                userState.scores[id] = 1;
            } else {
                feedback.innerHTML = '<span class="text-red font-medium"><i class="fas fa-times-circle mr-1"></i> Incorrect. The correct answer is shown above.</span>';
                userState.scores[id] = 0;
            }
            userState.completed.add(id);
            updateStats();
            renderProgressBars();
        }

        function answerTrueFalse(id, selected, correct) {
            const feedback = document.getElementById(`${id}-tf-feedback`);
            feedback.classList.remove('hidden');
            if (selected === correct) {
                feedback.innerHTML = '<span class="text-green font-medium"><i class="fas fa-check-circle mr-1"></i> Correct!</span>';
                userState.scores[id] = 1;
            } else {
                feedback.innerHTML = `<span class="text-red font-medium"><i class="fas fa-times-circle mr-1"></i> Incorrect. The answer is ${correct ? 'True' : 'False'}.</span>`;
                userState.scores[id] = 0;
            }
            userState.completed.add(id);
            updateStats();
            renderProgressBars();
        }

        function toggleBookmark(id) {
            if (userState.bookmarks.has(id)) {
                userState.bookmarks.delete(id);
            } else {
                userState.bookmarks.add(id);
            }
            renderQuestions();
            updateStats();
        }

        function toggleReview(id) {
            if (userState.review.has(id)) {
                userState.review.delete(id);
            } else {
                userState.review.add(id);
            }
            renderQuestions();
            updateStats();
        }

        // ===================== STATS & PROGRESS =====================
        function updateStats() {
            let totalCompleted = 0;
            let totalQuestions = 0;
            let correctAnswers = 0;
            let totalAnswered = 0;

            Object.values(questionsData).forEach(questions => {
                questions.forEach(q => {
                    totalQuestions++;
                    if (userState.completed.has(q.id)) {
                        totalCompleted++;
                        if (userState.scores[q.id] !== undefined) {
                            totalAnswered++;
                            if (userState.scores[q.id] === 1) correctAnswers++;
                        }
                    }
                });
            });

            document.getElementById('stat-completed').textContent = totalCompleted;
            document.getElementById('stat-bookmarked').textContent = userState.bookmarks.size;
            document.getElementById('stat-review').textContent = userState.review.size;
            document.getElementById('overall-progress').textContent = `${totalCompleted}/${totalQuestions}`;
            document.getElementById('overall-progress-bar').style.width = `${(totalCompleted / totalQuestions) * 100}%`;

            const accuracy = totalAnswered > 0 ? Math.round((correctAnswers / totalAnswered) * 100) : 0;
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;

            renderDifficultyChart();
        }

        function renderProgressBars() {
            const container = document.getElementById('progress-bars');
            container.innerHTML = subjects.map(sub => {
                const questions = questionsData[sub.code] || [];
                const completed = questions.filter(q => userState.completed.has(q.id)).length;
                const total = questions.length;
                const pct = total > 0 ? (completed / total) * 100 : 0;
                return `
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-text/80">${sub.code}</span>
                            <span class="text-text/60">${completed}/${total}</span>
                        </div>
                        <div class="w-full h-2 rounded-full bg-text/10 overflow-hidden">
                            <div class="h-full bg-${sub.color} rounded-full progress-bar" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDifficultyChart() {
            const canvas = document.getElementById('difficulty-chart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            let easy = 0, medium = 0, hard = 0;
            Object.values(questionsData).forEach(questions => {
                questions.forEach(q => {
                    if (userState.completed.has(q.id)) {
                        if (q.difficulty === 'easy') easy++;
                        else if (q.difficulty === 'medium') medium++;
                        else if (q.difficulty === 'hard') hard++;
                    }
                });
            });

            const total = easy + medium + hard;
            if (total === 0) {
                ctx.clearRect(0, 0, rect.width, rect.height);
                ctx.fillStyle = '#e2e2e840';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Complete questions to see distribution', rect.width / 2, rect.height / 2);
                return;
            }

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const radius = Math.min(centerX, centerY) - 20;

            const data = [
                { value: easy, color: '#9ca3af', label: 'Easy' },
                { value: medium, color: '#fbbf24', label: 'Medium' },
                { value: hard, color: '#f87171', label: 'Hard' }
            ];

            let startAngle = -Math.PI / 2;
            data.forEach(segment => {
                const sliceAngle = (segment.value / total) * 2 * Math.PI;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = segment.color;
                ctx.fill();

                // Label
                const midAngle = startAngle + sliceAngle / 2;
                const labelRadius = radius * 0.7;
                const labelX = centerX + Math.cos(midAngle) * labelRadius;
                const labelY = centerY + Math.sin(midAngle) * labelRadius;
                ctx.fillStyle = '#0a0a0f';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (segment.value > 0) {
                    ctx.fillText(`${segment.value}`, labelX, labelY);
                }

                startAngle += sliceAngle;
            });

            // Donut hole
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.4, 0, 2 * Math.PI);
            ctx.fillStyle = '#111118';
            ctx.fill();

            // Center text
            ctx.fillStyle = '#e2e2e8';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${total}`, centerX, centerY - 8);
            ctx.font = '12px sans-serif';
            ctx.fillStyle = '#e2e2e880';
            ctx.fillText('Done', centerX, centerY + 10);
        }

        // ===================== MODAL =====================
        function showScoreModal() {
            let totalAnswered = 0;
            let correctAnswers = 0;
            Object.entries(userState.scores).forEach(([id, score]) => {
                totalAnswered++;
                if (score === 1) correctAnswers++;
            });
            const accuracy = totalAnswered > 0 ? Math.round((correctAnswers / totalAnswered) * 100) : 0;
            const totalSeconds = Math.floor(userState.timerElapsed / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('modal-score').textContent = `${correctAnswers}/${totalAnswered}`;
            document.getElementById('modal-accuracy').textContent = `${accuracy}%`;
            document.getElementById('modal-time').textContent = `${minutes}m ${seconds}s`;
            document.getElementById('score-modal').classList.remove('hidden');
            document.getElementById('score-modal').classList.add('flex');
        }

        function closeScoreModal() {
            document.getElementById('score-modal').classList.add('hidden');
            document.getElementById('score-modal').classList.remove('flex');
        }

        function resetSession() {
            userState.completed.clear();
            userState.scores = {};
            userState.timerElapsed = 0;
            userState.timerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timer').classList.add('hidden');
            document.getElementById('start-timer-btn').classList.remove('hidden');
            document.getElementById('timer-display').textContent = '00:00:00';
            closeScoreModal();
            renderQuestions();
            updateStats();
            renderProgressBars();
        }

        // ===================== INIT =====================
        function init() {
            renderSubjectTabs();
            renderTopicFilters();
            renderQuestions();
            updateStats();
            renderProgressBars();
            document.getElementById('subject-stats').style.display = 'grid';

            // Add keyboard shortcut for timer
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
                    e.preventDefault();
                    if (userState.timerRunning || userState.timerElapsed > 0) {
                        toggleTimer();
                    } else {
                        startTimer();
                    }
                }
            });

            // Resize chart on window resize
            window.addEventListener('resize', renderDifficultyChart);
        }

        // Start
        init();
    </script>
</body>
</html>
