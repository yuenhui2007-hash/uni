<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monash B2026 Study Portal</title>
    <link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
/* ═══════════════════════════════════════════════════════════════
   Sōl Haus — Warm Minimalist Design System
   ═══════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg-deep: #130F0B;
  --bg-dark: #1C1814;
  --bg-card: #1F1B17;
  --bg-hover: #2A2520;
  --cream: #F5F0EB;
  --cream-warm: #E8E0D8;
  --taupe: #C4B5A5;
  --warm-grey: #8A7E72;
  --muted-brown: #6B5E52;
  --accent-gold: #B8A88A;
  --accent-glow: rgba(184, 168, 138, 0.15);
  --border: rgba(196, 181, 165, 0.12);
  --border-light: rgba(196, 181, 165, 0.20);
  --text: #F5F0EB;
  --text-secondary: #A89B8C;
  --text-muted: #6B5E52;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-heading: 'Playfair Display', Georgia, serif;
  --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.25);
  --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.20);
  --radius: 20px;
  --radius-sm: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(184,168,138,0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(196,181,165,0.02) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

/* ── Navbar ── */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(19, 15, 11, 0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
}
.navbar-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 72px; gap: 20px;
}
.navbar-brand {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-heading);
  font-weight: 700; font-size: 1.4rem;
  color: var(--cream); text-decoration: none;
}
.navbar-brand .logo {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-gold), var(--muted-brown));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 4px 16px var(--accent-glow);
}
.nav-links { display: flex; gap: 8px; }
.nav-link {
  font-family: var(--font-body);
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 8px 16px; border-radius: 999px;
  color: var(--text-secondary); text-decoration: none;
  transition: all 0.25s ease; border: 1px solid transparent;
}
.nav-link:hover {
  background: rgba(196, 181, 165, 0.08);
  color: var(--cream); border-color: var(--border);
}
.nav-link.active {
  background: rgba(184, 168, 138, 0.10);
  border-color: rgba(184, 168, 138, 0.25);
  color: var(--accent-gold);
}

/* ── Hero ── */
.hero {
  text-align: center; padding: 80px 24px 48px;
  position: relative; z-index: 1;
}
.hero h1 {
  font-family: var(--font-heading);
  font-size: 3.2rem; font-weight: 700;
  color: var(--cream);
  margin-bottom: 16px; letter-spacing: -0.02em;
  line-height: 1.15;
}
.hero h1 span {
  color: var(--accent-gold);
  font-style: italic;
}
.hero p {
  color: var(--text-secondary); font-size: 1.1rem;
  max-width: 520px; margin: 0 auto;
  font-weight: 300;
}

/* ── Layout ── */
.container {
  max-width: 1280px; margin: 0 auto;
  padding: 0 32px 80px;
  position: relative; z-index: 1;
}

/* ── Cards ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px; margin-top: 40px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px;
  transition: all 0.35s ease;
  text-decoration: none; color: var(--text);
  display: block; position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-gold), var(--taupe));
  opacity: 0; transition: opacity 0.3s ease;
}
.card:hover {
  border-color: var(--border-light);
  transform: translateY(-4px);
  box-shadow: var(--shadow-card);
}
.card:hover::before { opacity: 1; }
.card-icon {
  width: 52px; height: 52px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; margin-bottom: 20px;
  background: var(--bg-hover); border: 1px solid var(--border);
}
.card-title {
  font-family: var(--font-heading);
  font-size: 1.35rem; font-weight: 600;
  margin-bottom: 10px; color: var(--cream);
}
.card-desc {
  font-size: 0.92rem; color: var(--text-secondary);
  line-height: 1.65; font-weight: 300;
}
.card-arrow {
  position: absolute; bottom: 28px; right: 28px;
  color: var(--text-muted); font-size: 1.2rem;
  transition: all 0.25s ease;
}
.card:hover .card-arrow {
  color: var(--accent-gold); transform: translateX(4px);
}

/* ── Section headers ── */
.section-header {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 32px;
}
.section-header .icon {
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center; font-size: 1.2rem;
  background: var(--bg-hover); border: 1px solid var(--border);
}
.section-header h2 {
  font-family: var(--font-heading);
  font-size: 1.6rem; font-weight: 600; color: var(--cream);
}
.section-header p {
  color: var(--text-secondary); font-size: 0.9rem; margin-top: 2px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: 0.88rem;
  font-weight: 600; cursor: pointer; border: 1px solid transparent;
  transition: all 0.25s ease; text-decoration: none;
}
.btn-primary {
  background: var(--accent-gold); color: var(--bg-deep);
  border-color: var(--accent-gold);
}
.btn-primary:hover {
  background: #c4b896; transform: translateY(-1px);
}
.btn-outline {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border);
}
.btn-outline:hover {
  color: var(--cream); border-color: var(--border-light);
  background: rgba(196, 181, 165, 0.06);
}

/* ── Tables ── */
table {
  width: 100%; border-collapse: collapse;
  font-size: 0.9rem; margin: 16px 0;
}
th, td {
  padding: 12px 16px; text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: var(--bg-hover);
  font-weight: 600; color: var(--accent-gold);
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
}
tr:hover td { background: rgba(196, 181, 165, 0.03); }

/* ── Formulas ── */
.formula {
  background: rgba(196, 181, 165, 0.05);
  border-left: 3px solid var(--accent-gold);
  padding: 16px 20px; margin: 14px 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.05rem; overflow-x: auto;
}
.formula-label {
  font-family: var(--font-body); font-size: 0.75rem;
  color: var(--text-muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
}

/* ── Inputs ── */
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  padding: 10px 14px; background: var(--bg-dark);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: var(--font-body); font-size: 0.9rem;
  outline: none; transition: all 0.2s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

/* ── Tabs ── */
.tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
.tab {
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-size: 0.85rem; font-weight: 500; cursor: pointer;
  border: 1px solid transparent; color: var(--text-secondary);
  transition: all 0.25s ease; background: transparent;
}
.tab:hover { color: var(--cream); background: var(--bg-hover); }
.tab.active {
  color: var(--accent-gold); background: rgba(184, 168, 138, 0.08);
  border-color: var(--border);
}

/* ── Footer ── */
.footer {
  text-align: center; padding: 40px 24px;
  color: var(--text-muted); font-size: 0.85rem;
  border-top: 1px solid var(--border); margin-top: 60px;
  position: relative; z-index: 1;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--muted-brown); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--warm-grey); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .hero h1 { font-size: 2.2rem; }
  .hero { padding: 60px 20px 32px; }
  .navbar-inner { padding: 0; height: 64px; }
  .card-grid { grid-template-columns: 1fr; }
  .container { padding: 0 20px 60px; }
}
</style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">📚</div>
                <div class="logo-text">
                    <h1>Monash B2026</h1>
                    <span>Study Portal</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="notes.html"><i class="fas fa-sticky-note"></i> Notes</a>
                <a href="visual.html"><i class="fas fa-project-diagram"></i> Visual</a>
                <a href="planner.html"><i class="fas fa-calendar-alt"></i> Planner</a>
                <a href="study.html"><i class="fas fa-book"></i> Study</a>
                <a href="exercise.html"><i class="fas fa-dumbbell"></i> Exercise</a>
            </nav>
            <div class="user-profile">
                <span id="userDegree" style="color: var(--text-secondary); font-size: 0.9rem;">Bachelor of Science</span>
                <div class="user-avatar" id="userAvatar">JD</div>
            </div>
        </header>

        <div class="quote-bar animate-in">
            <i class="fas fa-quote-left"></i>
            <div>
                <span class="quote-text" id="quoteText">Loading...</span>
                <span class="quote-author" id="quoteAuthor"></span>
            </div>
            <i class="fas fa-quote-right"></i>
        </div>

        <div class="dashboard-grid" id="statsGrid"></div>

        <div class="main-grid">
            <div class="card animate-in">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-chart-pie"></i> Subject Progress</div>
                    <button class="card-action">View All</button>
                </div>
                <div class="progress-rings" id="progressRings"></div>
            </div>

            <div class="card animate-in delay-2">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-calculator"></i> GPA Calculator</div>
                </div>
                <div class="gpa-calculator">
                    <div class="gpa-display">
                        <div class="gpa-value" id="gpaValue">0.00</div>
                        <div class="gpa-label">Current GPA</div>
                    </div>
                    <div class="gpa-inputs" id="gpaInputs"></div>
                    <button class="btn-add" onclick="calculateGPA()">Recalculate GPA</button>
                </div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="card animate-in">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-chart-bar"></i> Weekly Study Hours</div>
                    <button class="card-action">This Month</button>
                </div>
                <div class="chart-container">
                    <canvas id="studyChart"></canvas>
                </div>
            </div>

            <div class="card animate-in delay-2">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-hourglass-half"></i> Upcoming Deadlines</div>
                </div>
                <div class="countdown-list" id="countdownList"></div>
            </div>
        </div>

        <div class="main-grid" style="margin-top: 20px;">
            <div class="card animate-in">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-fire-alt"></i> Study Streak</div>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="edit-btn" onclick="toggleStreakEdit()">Edit</button>
                        <button class="card-action" id="streakMonthLabel">August 2026</button>
                    </div>
                </div>
                <div class="streak-calendar" id="streakCalendar">
                    <div class="day-label">Mon</div>
                    <div class="day-label">Tue</div>
                    <div class="day-label">Wed</div>
                    <div class="day-label">Thu</div>
                    <div class="day-label">Fri</div>
                    <div class="day-label">Sat</div>
                    <div class="day-label">Sun</div>
                </div>
                <div class="streak-info" id="streakInfo"></div>
                <div class="inline-edit" id="streakEditPanel" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-color);">
                    <span style="font-size:0.8rem;color:var(--text-muted);">Click any day to toggle. Or log today:</span>
                    <button class="btn-add" style="padding:6px 14px;font-size:0.8rem;" onclick="logToday()">Log Today</button>
                </div>
            </div>

            <div class="card animate-in delay-2">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-history"></i> Recent Activity</div>
                    <button class="card-action">View All</button>
                </div>
                <div class="activity-feed" id="activityFeed"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        async function api(method, path, body) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const r = await fetch(`${API_BASE}${path}`, opts);
            return r.ok ? r.json() : null;
        }

        let appData = { stats: {}, streak: {}, config: {}, deadlines: [], activities: [] };

        async function loadAll() {
            const [stats, streak, config, deadlines, activities] = await Promise.all([
                api('GET','/api/stats'), api('GET','/api/streak'), api('GET','/api/config'),
                api('GET','/api/deadlines'), api('GET','/api/activities')
            ]);
            appData = { stats: stats||{}, streak: streak||{}, config: config||{}, deadlines: deadlines||[], activities: activities||[] };
            renderAll();
        }

        const GRADIENTS = {
            grad1: { id: "grad1", stops: [{ offset: "0%", color: "#60a5fa" }, { offset: "100%", color: "#a78bfa" }] },
            grad2: { id: "grad2", stops: [{ offset: "0%", color: "#a78bfa" }, { offset: "100%", color: "#f472b6" }] },
            grad3: { id: "grad3", stops: [{ offset: "0%", color: "#34d399" }, { offset: "100%", color: "#22d3ee" }] },
            grad4: { id: "grad4", stops: [{ offset: "0%", color: "#fb923c" }, { offset: "100%", color: "#f472b6" }] }
        };

        function renderAll() {
            document.getElementById('userDegree').textContent = appData.config.degree || 'Bachelor of Commerce';
            document.getElementById('userAvatar').textContent = appData.config.avatarInitials || 'YH';
            renderStats();
            renderProgressRings();
            renderGPA();
            renderCountdowns();
            renderStreakCalendar();
            renderActivity();
            setInitialQuote();
            animateNumbers();
            animateRings();
            initStudyChart();
            calculateGPA();
        }

        function renderStats() {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = '';
            const s = appData.stats;
            const statsArr = [
                { icon: "fas fa-book-open", value: s.hoursStudiedThisWeek || 0, label: "Hours Studied This Week", change: "+12% from last week", changeType: "positive" },
                { icon: "fas fa-tasks", value: s.assignmentsCompleted || 0, label: "Assignments Completed", change: "On track", changeType: "positive" },
                { icon: "fas fa-fire", value: s.studyStreakDays || 0, label: "Day Study Streak", change: "+3 days", changeType: "positive" },
                { icon: "fas fa-graduation-cap", value: s.currentGPA || 0, label: "Current GPA", change: "+0.2 this semester", changeType: "positive", isDecimal: true }
            ];
            statsArr.forEach((stat, i) => {
                const card = document.createElement('div');
                card.className = `stat-card animate-in delay-${i + 1}`;
                card.innerHTML = `
                    <div class="icon"><i class="${stat.icon}"></i></div>
                    <div class="value" data-target="${stat.value}" data-decimal="${stat.isDecimal ? 'true' : 'false'}">0</div>
                    <div class="label">${stat.label}</div>
                    <div class="change positive"><i class="fas fa-arrow-up"></i> ${stat.change}</div>
                    <div class="inline-edit" id="statEdit${i}">
                        <input class="edit-input" type="number" step="${stat.isDecimal?0.01:1}" value="${stat.value}" id="statInput${i}">
                        <button class="edit-btn" onclick="saveStat('${stat.label}', ${i})">Save</button>
                    </div>
                `;
                card.querySelector('.icon').addEventListener('dblclick', () => {
                    const edit = card.querySelector('.inline-edit');
                    edit.classList.toggle('active');
                });
                grid.appendChild(card);
            });
        }

        async function saveStat(label, idx) {
            const val = parseFloat(document.getElementById(`statInput${idx}`).value);
            if (label.includes('Hours')) appData.stats.hoursStudiedThisWeek = val;
            else if (label.includes('Assignments')) appData.stats.assignmentsCompleted = val;
            else if (label.includes('Streak')) appData.stats.studyStreakDays = val;
            else if (label.includes('GPA')) appData.stats.currentGPA = val;
            await api('PUT','/api/stats', appData.stats);
            loadAll();
        }

        function renderProgressRings() {
            const container = document.getElementById('progressRings');
            container.innerHTML = '';
            const subjects = appData.config.subjects || [
                { name: "Financial Accounting", code: "ACW1120", progress: 78, gradient: "grad1" },
                { name: "Foundations of Finance", code: "BFW1001", progress: 65, gradient: "grad2" },
                { name: "Business Law", code: "BTW1042", progress: 92, gradient: "grad3" },
                { name: "Economics", code: "ECM1953", progress: 54, gradient: "grad4" }
            ];
            subjects.forEach((sub, i) => {
                const grad = GRADIENTS[sub.gradient || 'grad1'];
                const item = document.createElement('div');
                item.className = 'ring-item';
                item.innerHTML = `
                    <div class="ring-container">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <defs>
                                <linearGradient id="${grad.id}-${i}" x1="0%" y1="0%" x2="100%" y2="100%">
                                    ${grad.stops.map(s => `<stop offset="${s.offset}" style="stop-color:${s.color}"/>`).join('')}
                                </linearGradient>
                            </defs>
                            <circle class="ring-bg" cx="60" cy="60" r="52"/>
                            <circle class="ring-progress" cx="60" cy="60" r="52" 
                                stroke="url(#${grad.id}-${i})" 
                                stroke-dasharray="326.73" 
                                stroke-dashoffset="326.73"
                                data-progress="${sub.progress}"/>
                        </svg>
                        <div class="ring-text">${sub.progress}%</div>
                    </div>
                    <div class="ring-label">${sub.name}</div>
                    <div class="ring-code">${sub.code || ''}</div>
                `;
                container.appendChild(item);
            });
        }

        function renderGPA() {
            const container = document.getElementById('gpaInputs');
            container.innerHTML = '';
            const rows = appData.config.gpaRows || [
                { grade: 2.0, credits: 6, subject: "ACW1120 - Financial Accounting" },
                { grade: 3.0, credits: 6, subject: "BFW1001 - Foundations of Finance" },
                { grade: 4.0, credits: 6, subject: "BTW1042 - Business Law" },
                { grade: 2.0, credits: 6, subject: "ECM1953 - Economics" }
            ];
            const gradeOptions = [
                { value: 4.0, label: "HD (4.0)" }, { value: 3.0, label: "D (3.0)" },
                { value: 2.0, label: "C (2.0)" }, { value: 1.0, label: "P (1.0)" }, { value: 0.0, label: "F (0.0)" }
            ];
            rows.forEach(row => {
                const div = document.createElement('div');
                div.className = 'gpa-row';
                div.innerHTML = `
                    <select onchange="calculateGPA()">
                        ${gradeOptions.map(g => `<option value="${g.value}"${g.value === row.grade ? ' selected' : ''}>${g.label}</option>`).join('')}
                    </select>
                    <input type="number" class="credit-input" value="${row.credits}" min="0" max="24" onchange="calculateGPA()">
                    <input type="text" class="subject-name" value="${row.subject}" readonly>
                `;
                container.appendChild(div);
            });
        }

        function renderCountdowns() {
            const container = document.getElementById('countdownList');
            container.innerHTML = '';
            const deadlines = appData.deadlines.length ? appData.deadlines : [
                { title: "Mid-Semester Exam", subject: "ACW1120 - Financial Accounting", date: "2026-09-05T09:00:00", urgent: true },
                { title: "Assignment 2 Due", subject: "BFW1001 - Foundations of Finance", date: "2026-09-12T23:59:00", urgent: false },
                { title: "Lab Report", subject: "BTW1042 - Business Law", date: "2026-09-18T17:00:00", urgent: false }
            ];
            deadlines.forEach(d => {
                const item = document.createElement('div');
                item.className = `countdown-item${d.urgent ? ' urgent' : ''}`;
                item.innerHTML = `
                    <div class="countdown-title">${d.title}</div>
                    <div class="countdown-subject">${d.subject}</div>
                    <div class="countdown-timer" data-date="${d.date}">
                        <div class="time-unit"><div class="time-value">00</div><div class="time-label">Days</div></div>
                        <div class="time-unit"><div class="time-value">00</div><div class="time-label">Hrs</div></div>
                        <div class="time-unit"><div class="time-value">00</div><div class="time-label">Mins</div></div>
                        <div class="time-unit"><div class="time-value">00</div><div class="time-label">Secs</div></div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        let streakEditMode = false;
        function toggleStreakEdit() {
            streakEditMode = !streakEditMode;
            document.getElementById('streakEditPanel').classList.toggle('active');
        }

        async function logToday() {
            const r = await api('POST','/api/streak/today');
            if (r) { alert(`Study logged! Today level: ${r.todayLevel}, Streak: ${r.currentStreak} days`); loadAll(); }
        }

        async function toggleStreakDay(dayIndex) {
            if (!streakEditMode) return;
            const days = appData.streak.days || Array(31).fill(0);
            days[dayIndex] = days[dayIndex] > 0 ? 0 : Math.min(5, (days[dayIndex] || 0) + 3);
            appData.streak.days = days;
            await api('PUT','/api/streak', appData.streak);
            loadAll();
        }

        function renderStreakCalendar() {
            const calendar = document.getElementById('streakCalendar');
            const labels = calendar.querySelectorAll('.day-label');
            calendar.innerHTML = '';
            labels.forEach(l => calendar.appendChild(l));

            const streak = appData.streak || {};
            const emptyDays = streak.emptyDays !== undefined ? streak.emptyDays : 5;
            const days = streak.days || Array(31).fill(0);

            for (let i = 0; i < emptyDays; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                calendar.appendChild(empty);
            }

            const today = new Date().getDate();
            for (let day = 1; day <= days.length; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                const level = days[day - 1] || 0;
                if (level > 0) cell.classList.add(`level-${level}`);
                if (day === today) cell.classList.add('today');
                cell.title = `${streak.month || 'This Month'} ${day}${level > 0 ? `: Level ${level} study session` : ': No study'}`;
                cell.onclick = () => toggleStreakDay(day - 1);
                calendar.appendChild(cell);
            }

            document.getElementById('streakMonthLabel').textContent = streak.month || 'This Month';
            const stats = streak.stats || { currentStreak: 0, longestStreak: 0, totalDays: 0, consistency: '0%' };
            document.getElementById('streakInfo').innerHTML = [
                { value: stats.currentStreak, label: 'Current Streak' },
                { value: stats.longestStreak, label: 'Longest Streak' },
                { value: stats.totalDays, label: 'Total Days' },
                { value: stats.consistency, label: 'Consistency' }
            ].map(s => `
                <div class="streak-stat">
                    <div class="streak-stat-value">${s.value}</div>
                    <div class="streak-stat-label">${s.label}</div>
                </div>
            `).join('');
        }

        function renderActivity() {
            const container = document.getElementById('activityFeed');
            container.innerHTML = '';
            const acts = appData.activities.length ? appData.activities : [
                { type: "study", icon: "fas fa-book", title: "Completed Accounting Notes", meta: "ACW1120 - Chapter 5", time: "2h ago" },
                { type: "quiz", icon: "fas fa-check-circle", title: "Scored 85% on Quiz", meta: "BFW1001 - Time Value of Money", time: "5h ago" },
                { type: "assignment", icon: "fas fa-file-alt", title: "Submitted Case Study", meta: "BTW1042 - Contract Law", time: "Yesterday" },
                { type: "video", icon: "fas fa-video", title: "Watched Lecture Recording", meta: "ECM1953 - Supply & Demand", time: "Yesterday" }
            ];
            acts.forEach(act => {
                const item = document.createElement('div');
                item.className = 'activity-item';
                item.innerHTML = `
                    <div class="activity-icon ${act.type}"><i class="${act.icon}"></i></div>
                    <div class="activity-content">
                        <div class="activity-title">${act.title}</div>
                        <div class="activity-meta">${act.meta}</div>
                    </div>
                    <div class="activity-time">${act.time}</div>
                `;
                container.appendChild(item);
            });
        }

        function animateNumbers() {
            document.querySelectorAll('.stat-card .value[data-target]').forEach(counter => {
                const target = parseFloat(counter.dataset.target);
                const isDecimal = counter.dataset.decimal === 'true';
                const duration = 2000, startTime = performance.now();
                function update(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const current = target * easeOut;
                    counter.textContent = isDecimal ? current.toFixed(2) : Math.round(current);
                    if (progress < 1) requestAnimationFrame(update);
                }
                requestAnimationFrame(update);
            });
        }

        function animateRings() {
            document.querySelectorAll('.ring-progress').forEach(ring => {
                const progress = parseInt(ring.dataset.progress);
                const circumference = 2 * Math.PI * 52;
                const offset = circumference - (progress / 100) * circumference;
                setTimeout(() => { ring.style.strokeDashoffset = offset; }, 500);
            });
        }

        let studyChartInstance = null;
        function initStudyChart() {
            const ctx = document.getElementById('studyChart');
            if (!ctx) return;
            if (studyChartInstance) studyChartInstance.destroy();
            const gradient1 = ctx.getContext('2d').createLinearGradient(0, 0, 0, 250);
            gradient1.addColorStop(0, 'rgba(96, 165, 250, 0.8)');
            gradient1.addColorStop(1, 'rgba(96, 165, 250, 0.1)');
            const gradient2 = ctx.getContext('2d').createLinearGradient(0, 0, 0, 250);
            gradient2.addColorStop(0, 'rgba(167, 139, 250, 0.8)');
            gradient2.addColorStop(1, 'rgba(167, 139, 250, 0.1)');

            studyChartInstance = new Chart(ctx.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                    datasets: [{
                        label: 'This Week',
                        data: [3.5, 4, 2.5, 5, 3, 6, 4],
                        backgroundColor: gradient1,
                        borderColor: '#60a5fa',
                        borderWidth: 1,
                        borderRadius: 8,
                    }, {
                        label: 'Last Week',
                        data: [2, 3, 3.5, 4, 2.5, 5, 3.5],
                        backgroundColor: gradient2,
                        borderColor: '#a78bfa',
                        borderWidth: 1,
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#9ca3af', font: { family: 'Inter', size: 12 } }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#6b7280', font: { family: 'Inter', size: 11 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#6b7280', font: { family: 'Inter', size: 11 } }
                        }
                    }
                }
            });
        }

        function calculateGPA() {
            const rows = document.querySelectorAll('#gpaInputs .gpa-row');
            let totalPoints = 0, totalCredits = 0;
            rows.forEach(row => {
                const grade = parseFloat(row.querySelector('select').value);
                const credits = parseFloat(row.querySelector('.credit-input').value) || 0;
                totalPoints += grade * credits;
                totalCredits += credits;
            });
            const gpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
            document.getElementById('gpaValue').textContent = gpa;
        }

        function updateCountdowns() {
            document.querySelectorAll('.countdown-timer').forEach(timer => {
                const targetDate = new Date(timer.dataset.date);
                const now = new Date();
                const diff = targetDate - now;
                if (diff > 0) {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    const units = timer.querySelectorAll('.time-value');
                    units[0].textContent = String(days).padStart(2, '0');
                    units[1].textContent = String(hours).padStart(2, '0');
                    units[2].textContent = String(minutes).padStart(2, '0');
                    units[3].textContent = String(seconds).padStart(2, '0');
                }
            });
        }

        const quotes = [
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
            { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Education is the most powerful weapon which you can use to change the world.", author: "Nelson Mandela" },
            { text: "It always seems impossible until it's done.", author: "Nelson Mandela" }
        ];
        let quoteIndex = 0;
        function rotateQuotes() {
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            quoteText.style.opacity = '0'; quoteAuthor.style.opacity = '0';
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % quotes.length;
                quoteText.textContent = `"${quotes[quoteIndex].text}"`;
                quoteAuthor.textContent = `— ${quotes[quoteIndex].author}`;
                quoteText.style.opacity = '1'; quoteAuthor.style.opacity = '1';
            }, 500);
        }
        function setInitialQuote() {
            const q = quotes[0];
            document.getElementById('quoteText').textContent = `"${q.text}"`;
            document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAll();
            setInterval(updateCountdowns, 1000);
            setInterval(rotateQuotes, 15000);
        });
    </script>
</body>
</html>
