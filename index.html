<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monash B2026 — Accountancy Notes</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --bg-2: #161b22;
            --surface: #21262d;
            --surface-hover: #30363d;
            --border: #30363d;
            --border-light: #484f58;
            --text: #e6edf3;
            --text-secondary: #7d8590;
            --text-muted: #484f58;
            --blue: #58a6ff;
            --green: #3fb950;
            --purple: #bc8cff;
            --yellow: #d29922;
            --pink: #f778ba;
            --red: #f85149;
            --teal: #39c5cf;
            --orange: #ff9b44;
            --font: 'Inter', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14.5px;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== NAVIGATION BAR ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }
        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            text-decoration: none;
        }
        .navbar-brand .logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .navbar-brand span {
            background: linear-gradient(135deg, #fff 0%, var(--blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }
        .dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dropdown-trigger:hover {
            background: var(--surface-hover);
            border-color: var(--border-light);
        }
        .dropdown-trigger .arrow {
            transition: transform 0.2s;
            font-size: 0.7rem;
        }
        .dropdown.open .dropdown-trigger .arrow {
            transform: rotate(180deg);
        }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 280px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .dropdown.open .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            color: var(--text);
            font-family: var(--font);
            font-size: 0.9rem;
        }
        .dropdown-item:hover {
            background: var(--surface);
        }
        .dropdown-item.active {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
        }
        .dropdown-item .item-emoji {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: var(--c-dim);
            border: 1px solid var(--c-weak);
            flex-shrink: 0;
        }
        .dropdown-item .item-info {
            flex: 1;
            min-width: 0;
        }
        .dropdown-item .item-code {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--c);
            font-weight: 500;
        }
        .dropdown-item .item-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
        }

        /* ===== CONTENT AREA ===== */
        .content-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* Subject Header */
        .subject-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .subject-header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .subject-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: var(--c-dim);
            border: 1px solid var(--c-weak);
        }
        .subject-title-wrap h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .subject-title-wrap .code {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--c);
            font-weight: 500;
        }
        .subject-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
        }
        .subject-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .subject-tag {
            font-size: 0.75rem;
            background: var(--surface);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        /* ===== MARKDOWN ===== */
        .md h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 36px 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--c);
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .md h2:first-child { margin-top: 0; }
        .md h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 24px 0 12px;
            color: var(--c);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .md h3::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--c);
            border-radius: 2px;
            opacity: 0.6;
        }
        .md h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 18px 0 10px;
            color: var(--green);
        }
        .md p {
            margin-bottom: 12px;
            color: var(--text-secondary);
        }
        .md p strong { color: var(--text); }
        .md ul, .md ol { margin: 10px 0 14px 20px; }
        .md li { margin-bottom: 6px; color: var(--text-secondary); }
        .md li::marker { color: var(--c); }
        .md a { color: var(--blue); text-decoration: none; }
        .md a:hover { text-decoration: underline; }

        .md code {
            background: rgba(88,166,255,0.08);
            color: var(--blue);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 0.85em;
            border: 1px solid rgba(88,166,255,0.12);
        }
        .md pre {
            background: #010409;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            overflow-x: auto;
            margin: 16px 0;
        }
        .md pre code {
            background: transparent;
            padding: 0;
            color: var(--text-secondary);
            border: none;
            font-size: 0.84em;
            line-height: 1.6;
        }

        .md table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 16px 0;
            font-size: 0.87rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .md th {
            background: var(--surface);
            font-weight: 600;
            color: var(--c);
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .md td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .md tr:last-child td { border-bottom: none; }
        .md tr:nth-child(even) { background: rgba(33, 38, 45, 0.5); }

        .md blockquote {
            border-left: 3px solid var(--c);
            padding: 14px 18px;
            margin: 14px 0;
            background: rgba(255,255,255,0.015);
            border-radius: 0 10px 10px 0;
            color: var(--text-secondary);
        }
        .md blockquote p { margin-bottom: 6px; }
        .md blockquote p:last-child { margin-bottom: 0; }
        .md blockquote strong { color: var(--c); }

        .md hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 28px 0;
        }

        /* ===== LOADING / EMPTY ===== */
        .loading {
            text-align: center;
            padding: 80px 20px;
        }
        .loading-ring {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-muted);
        }
        .empty-state h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }
        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .empty-state .hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        footer p {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 640px) {
            .navbar { padding: 0 16px; }
            .navbar-brand span { display: none; }
            .dropdown-menu { right: -20px; min-width: 260px; }
            .content-wrap { padding: 24px 16px 40px; }
            .subject-title-wrap h1 { font-size: 1.4rem; }
            .subject-icon { width: 44px; height: 44px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="#" class="navbar-brand" onclick="showHome(); return false;">
                <div class="logo">🎓</div>
                <span>Accountancy Notes</span>
            </a>

            <div style="display:flex;align-items:center;gap:10px">
                <div class="dropdown" id="subjectDropdown">
                    <button class="dropdown-trigger" onclick="toggleDropdown()">
                        <span>📚 Subjects</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
                <button class="dropdown-trigger" onclick="selectSubject('ETC2440')" style="--c:#ff9b44">
                    <span>🔍 Analytics</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="content-wrap" id="contentArea">
        <div class="loading" id="loading">
            <div class="loading-ring"></div>
            <p style="color:var(--text-secondary)">Loading notes...</p>
        </div>

        <div class="empty-state" id="emptyState" style="display:none">
            <h2>Welcome to Your Notes</h2>
            <p>Select a subject from the dropdown above to view detailed notes with definitions, examples, and formulas.</p>
            <div class="hint">👆 Click "Subjects" in the top right</div>
        </div>

        <div id="subjectContent" style="display:none">
            <div class="subject-header" id="subjectHeader"></div>
            <div class="md" id="markdownContent"></div>
        </div>
    </main>

    <footer>
        <p>Monash B2026 Accountancy Major · Enhanced Edition · 2026</p>
    </footer>

    <script>
        const coreSubjects = [
            { code: 'ACW1120', name: 'Financial Accounting 1', emoji: '📊', c: '#58a6ff', dim: 'rgba(88,166,255,0.1)', weak: 'rgba(88,166,255,0.2)', desc: 'Double-entry, accrual accounting, financial statements, IFRS framework', tags: ['Journal Entries', 'Trial Balance', 'SOFP & P&L'] },
            { code: 'BFW1001', name: 'Foundations of Finance', emoji: '💰', c: '#3fb950', dim: 'rgba(63,185,80,0.1)', weak: 'rgba(63,185,80,0.2)', desc: 'Time value of money, risk-return, NPV, IRR, valuation', tags: ['TVM', 'Annuities', 'Risk Analysis'] },
            { code: 'BTW1042', name: 'Business Law', emoji: '⚖️', c: '#bc8cff', dim: 'rgba(188,140,255,0.1)', weak: 'rgba(188,140,255,0.2)', desc: 'Contract law, tort, agency, Malaysian legal system', tags: ['Contracts', 'Negligence', 'Companies Act'] },
            { code: 'ECM1953', name: 'Economics', emoji: '📈', c: '#d29922', dim: 'rgba(210,153,34,0.1)', weak: 'rgba(210,153,34,0.2)', desc: 'Demand & supply, market structures, macroeconomics', tags: ['Elasticity', 'Market Structures', 'GDP'] },
            { code: 'ETW1001', name: 'Business Statistics', emoji: '📉', c: '#f778ba', dim: 'rgba(247,120,186,0.1)', weak: 'rgba(247,120,186,0.2)', desc: 'Probability, hypothesis testing, regression, forecasting', tags: ['Probability', 'Confidence Int', 'Regression'] },
            { code: 'MGW1010', name: 'Introduction to Management', emoji: '🎯', c: '#f85149', dim: 'rgba(248,81,73,0.1)', weak: 'rgba(248,81,73,0.2)', desc: 'Management theories, POLC, leadership, ethics & CSR', tags: ['POLC', 'Leadership', 'CSR'] },
            { code: 'ACW2220', name: 'Management Accounting', emoji: '🧮', c: '#39c5cf', dim: 'rgba(57,197,207,0.1)', weak: 'rgba(57,197,207,0.2)', desc: 'Cost behaviour, ABC costing, budgeting, variance', tags: ['Cost Behavior', 'ABC', 'Budgeting'] },
        ];

        const electiveSubject = { code: 'ETC2440', name: 'Business Analytics & Econometrics', emoji: '🔍', c: '#ff9b44', dim: 'rgba(255,155,68,0.1)', weak: 'rgba(255,155,68,0.2)', desc: 'Data analysis, regression, causal inference, A/B testing, policy evaluation', tags: ['Regression', 'DiD', 'A/B Testing', 'KPIs'] };

        const subjects = [...coreSubjects, electiveSubject];

        let unitData = [];
        let activeCode = null;

        // Build dropdown menu (core subjects only)
        function buildDropdown() {
            const menu = document.getElementById('dropdownMenu');
            menu.innerHTML = coreSubjects.map(s => `
                <button class="dropdown-item" data-code="${s.code}" onclick="selectSubject('${s.code}')" style="--c:${s.c};--c-dim:${s.dim};--c-weak:${s.weak}">
                    <div class="item-emoji">${s.emoji}</div>
                    <div class="item-info">
                        <div class="item-code">${s.code}</div>
                        <div class="item-name">${s.name}</div>
                    </div>
                </button>
            `).join('');
        }

        function toggleDropdown() {
            document.getElementById('subjectDropdown').classList.toggle('open');
        }

        function closeDropdown() {
            document.getElementById('subjectDropdown').classList.remove('open');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) closeDropdown();
        });

        function selectSubject(code) {
            closeDropdown();
            const subject = subjects.find(s => s.code === code);
            const unit = unitData.find(u => u.code === code);
            if (!subject || !unit) return;

            activeCode = code;

            // Highlight active in dropdown
            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.classList.toggle('active', item.dataset.code === code);
            });

            // Show content
            document.getElementById('loading').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('subjectContent').style.display = 'block';

            // Build header
            document.getElementById('subjectHeader').innerHTML = `
                <div class="subject-header-top">
                    <div class="subject-icon" style="background:${subject.dim};border-color:${subject.weak}">${subject.emoji}</div>
                    <div class="subject-title-wrap">
                        <h1>${subject.name}</h1>
                        <div class="code" style="color:${subject.c}">${subject.code}</div>
                    </div>
                </div>
                <p class="subject-desc">${subject.desc}</p>
                <div class="subject-tags">${subject.tags.map(t => `<span class="subject-tag">${t}</span>`).join('')}</div>
            `;

            // Render markdown
            document.getElementById('markdownContent').innerHTML = marked.parse(unit.content);
            document.getElementById('markdownContent').style.setProperty('--c', subject.c);

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showHome() {
            activeCode = null;
            document.querySelectorAll('.dropdown-item').forEach(item => item.classList.remove('active'));
            document.getElementById('subjectContent').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }

        // Load both markdown files
        Promise.all([
            fetch('monash_b2026_partA_accountancy.md?v=6').then(r => r.text()),
            fetch('monash_b2026_electives.md?v=1').then(r => r.text())
        ])
            .then(([coreMd, electiveMd]) => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';

                // Parse core units
                function parseUnits(md) {
                    const lines = md.split('\n');
                    let current = null;
                    let content = [];
                    const units = [];

                    for (const line of lines) {
                        const m = line.match(/^## Unit [A-Z]?\d+:\s+([A-Z]{3}\d{4})\s+—\s+(.+)/);
                        if (m) {
                            if (current) units.push({ code: current.code, name: current.name, content: content.join('\n') });
                            current = { code: m[1], name: m[2] };
                            content = [];
                        } else if (current) {
                            content.push(line);
                        }
                    }
                    if (current) units.push({ code: current.code, name: current.name, content: content.join('\n') });
                    return units;
                }

                unitData = [...parseUnits(coreMd), ...parseUnits(electiveMd)];

                // Add integration section from core
                const intMatch = coreMd.match(/(## Integration[\s\S]*)/);
                if (intMatch) unitData.push({ code: 'EXAM', name: 'Integration & Exam Prep', content: intMatch[1] });

                buildDropdown();
            })
            .catch(() => {
                document.getElementById('loading').innerHTML = '<p style="color:var(--red)">Failed to load notes.</p>';
            });
    </script>
</body>
</html>
